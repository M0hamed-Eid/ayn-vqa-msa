[project]
name = "ayn-vqa"
version = "0.1.0"
description = "Ayn-VQA (ImageEval 2026, Task 1a, MSA track) data pipeline and modeling harness"
readme = "README.md"
authors = [
    { name = "M0hamed-Eid", email = "mohammedeidabdelmeguid@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "faster-whisper>=1.2.1",
    "httpx>=0.28.1",
    "matplotlib>=3.11.0",
    "pandas>=3.0.3",
    "pillow>=12.3.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "rich>=15.0.0",
    "soundfile>=0.14.0",
    "tabulate>=0.10.0",
]

[project.scripts]
aynvqa-audit = "ayn_vqa.audit.run_audit:main"
aynvqa-predict = "ayn_vqa.run_baseline:main"
aynvqa-transcribe = "ayn_vqa.run_asr_bench:main"
aynvqa-run = "ayn_vqa.run_pipeline:main"

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"
# Vendored, unmodified upstream code (see scorer_official/README.md) --
# not ours to reformat or fix lint findings in.
extend-exclude = ["scorer_official"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.mypy]
python_version = "3.13"
strict = true
disallow_untyped_defs = true
warn_unused_ignores = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["soundfile.*", "faster_whisper.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["src/ayn_vqa"]

[dependency-groups]
dev = [
    "mypy>=2.2.0",
    "numpy>=2.5.1",
    "pandas-stubs>=3.0.3.260530",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.21",
]
gpu = [
    "nvidia-cublas-cu12>=12.9.2.10",
    "nvidia-cudnn-cu12>=9.24.0.43",
]
notebook = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.1",
]
